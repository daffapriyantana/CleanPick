name: cleanpick
description: "CleanPick - Aplikasi layanan pengangkutan sampah (Milestone 3: State Management Modern & Clean Architecture)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0
  geolocator: ^13.0.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
